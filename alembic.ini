# Alembic configuration for U-03 data-management.
#
# The URL is a placeholder: it is overridden from the environment in env.py so
# the same migrations apply to SQLite (PoC) and PostgreSQL (production) by a
# connection-string change alone (U01-H18). Never commit a real DSN here.

[alembic]
script_location = alembic
prepend_sys_path = src
sqlalchemy.url = sqlite+pysqlite:///app.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
